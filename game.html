<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070d1b">
<meta name="description" content="Cloud Hopper — a tiny cloud-native arcade game by Jisna C John.">
<title>Cloud Hopper | Jisna C John</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="cloud-hopper.css">
</head>
<body class="hopper-page">
<header class="hopper-nav"><a class="brand" href="index.html"><span>JISNA C JOHN</span></a><a href="index.html" class="hopper-back">← Back to portfolio</a></header>
<main class="hopper-main">
  <section class="hopper-card" aria-label="Cloud Hopper game">
    <div class="hopper-toolbar"><div><span class="hopper-dot"></span><span id="hopperStatus">READY TO DEPLOY</span></div><div class="hopper-scores"><span>SCORE <b id="hopperScore">0</b></span><span>BEST <b id="hopperBest">0</b></span></div></div>
    <div class="hopper-stage" id="hopperStage" tabindex="0" role="button" aria-label="Cloud Hopper game. Press Space, Arrow Up, click or tap to hop.">
      <canvas id="hopperCanvas" width="900" height="360"></canvas>
      <div class="hopper-overlay" id="hopperOverlay"><div class="overlay-cloud">☁</div><h2>Ready, little cloud?</h2><p>Tap, click or press <kbd>SPACE</kbd> to float</p><button id="hopperStart" class="button button-primary" type="button">Let’s float ✨</button></div>
    </div>
    <div class="hopper-foot"><p id="hopperHint">Collect the little green stars and keep floating ☁️</p><span>SPACE / ↑ / TAP TO HOP</span></div>
  </section>
</main>
<script src="cloud-hopper.js"></script>
</body></html>
